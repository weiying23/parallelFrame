# ============================================================
# 硬件/线程配置文件
# ============================================================

# 线程组数 (≤1 时自动切换为非组模式)
N_GROUPS = 2

# 每组 worker 数 (不含 GMT)
N_WORKERS = 3

# 组间分解策略: 0=Y_ONLY, 1=XY_2D
GROUP_DECOMP = 0

# 每核心簇的核心数 (用于 CPU 绑定)
NCorePClu = 5

# 每节点核心簇数
NCluPNode = 2

# 每组核心数
NCorePGrp = 4

# 管理核心 ID (-1=自动选首个, -2=选末尾, ≥0=指定)
ManageCoreId = 4

# 核心偏移 (跳过每个 cluster 的前 N 个核, 默认 0)
CoreOffset = 0

# Cluster 偏移 (跳过每个节点前 N 个 cluster, 默认 0)
ClustOffset = 0

# ============================================================
# 负载不均衡测试 (环境变量可覆盖)
# ============================================================

# 不均衡百分比 (0=均衡, N=最后 worker 多 N% 行)
WAVE_IMBALANCE_PCT = 0

# 重载 worker 索引 (-1=每组最后一个)
WAVE_IMBALANCE_WORKER = -1
